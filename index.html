  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #0a0a0a;
      color: #0f0f0f;
      font: 400 15px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: min(100%, 32rem);
      aspect-ratio: 3.5 / 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: clamp(1.75rem, 5vw, 3rem);
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 30px 60px -20px rgba(0,0,0,.8);
      animation: rise .9s cubic-bezier(.2,.7,.2,1) both;
    }
    h1 {
      font: 400 clamp(2.5rem, 7vw, 3.75rem)/1 Newsreader, Georgia, serif;
      letter-spacing: 0;
      margin: 0 0 .6rem;
    }
    p { margin: 0; max-width: 28rem; }
    .muted { color: #6e6e6e; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem 1.75rem;
      justify-content: center;
      margin-top: 2.25rem;
    }
    a {
      color: inherit;
      text-decoration: none;
      background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
      transition: background-size .3s ease;
    }
    a:hover, a:focus-visible { background-size: 100% 1px; }
    p a { background-size: 100% 1px; color: #0f0f0f; }
    nav a { font-size: .75rem; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; }
    nav a { display: inline-flex; align-items: center; background: none; }
    nav a svg { width: 13px; height: 13px; margin-right: 4px; fill: currentColor; flex: none; }
    nav a span {
      background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
      transition: background-size .3s ease;
    }
    nav a:hover span, nav a:focus-visible span { background-size: 100% 1px; }
    @media (max-width: 420px) {
      .card { aspect-ratio: auto; padding: 3rem 1.5rem; }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  </style>
